name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - "starter/backend/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            -t backend:${{ github.sha }} \
            ./starter/backend

      - name: Save Docker image
        run: |
          docker save backend:${{ github.sha }} -o backend-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar

  push:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: backend-image

      - name: Load Docker image
        run: |
          docker load -i backend-image.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag \
            backend:${{ github.sha }} \
            $ECR_REGISTRY/backend:${{ github.sha }}

          docker push \
            $ECR_REGISTRY/backend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: us-east-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name cluster

      - name: Get AWS account ID
        id: account
        run: |
          echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Update Kubernetes deployment
        run: |
          sed -i \
            "s|image: backend|image: ${{ steps.account.outputs.account_id }}.dkr.ecr.us-east-1.amazonaws.com/backend:${{ github.sha }}|" \
            starter/backend/k8s/deployment.yaml

      - name: Deploy backend to EKS
        run: |
          kubectl apply -k starter/backend/k8s
